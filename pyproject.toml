[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tuke-fim"
version = "1.0.0"
description = "Linux file integrity monitor with a trusted daily HTML recipe"
requires-python = ">=3.12"
dependencies = ["watchdog>=6,<8"]

[project.scripts]
fim = "fim.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "aiosmtpd>=1.4.6,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
