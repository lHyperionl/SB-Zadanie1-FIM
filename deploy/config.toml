[paths]
web_root = "/var/www/fim-demo"
baseline = "/var/lib/fim/reference/baseline.sqlite"
runtime_dir = "/var/lib/fim/runtime"
log_dir = "/var/log/fim"
staging_dir = "/var/www/fim-staging"
template = "/opt/fim/data/index.template.html"
calendar = "/opt/fim/data/namedays.sk.json"

[security]
require_root_owned = true
read_group = "fim-read"

[monitor]
scan_interval = 30
debounce = 0.2
max_file_bytes = 67108864
max_entries = 10000

[page]
timezone = "Europe/Bratislava"
midnight_grace = 5
owner = "fim-publisher"
group = "fim-web"
mode = "0664"

[smtp]
host = "127.0.0.1"
port = 1025
mode = "plain"
sender = "fim@example.test"
recipients = ["admin@example.test"]
username = ""
password_env = "FIM_SMTP_PASSWORD"
