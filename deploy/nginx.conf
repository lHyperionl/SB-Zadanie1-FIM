server {
    listen 8080;
    server_name _;
    root /var/www/fim-demo;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store" always;
    location / { try_files $uri $uri/ =404; }
    # The demonstration serves static content only.
    location ~ \.php$ { return 403; }
}
